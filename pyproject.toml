[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veille-ia"
version = "0.1.0"
description = "Veille quotidienne de l'actualité IA : collecte RSS, regroupement des doublons, classement par thème, page web statique."
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
veille = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
