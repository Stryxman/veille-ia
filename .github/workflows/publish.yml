name: Publication

on:
  schedule:
    # GitHub does not guarantee scheduled runs (the 2026-10-02 run and the first 2026-10-03
    # slot were skipped, later runs started 3 to 9 hours late): three slots a day in UTC,
    # 17 past the hour (runs on the hour are delayed or dropped most often).
    # No update time is promised.
    - cron: "17 4 * * *"
    - cron: "17 10 * * *"
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: synthese  # holds the model key; limited to main (docs/cle-api.md)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install .
      - name: Build the page
        # Fails (exit 1) when no article is collected: nothing is deployed,
        # the previous page stays online.
        run: python -m veille.render --output site
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}  # environment secret, this step only
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:  # only this job publishes
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
