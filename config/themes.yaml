# Thèmes de la veille et mots-clés (français et anglais), dans l'ordre de priorité.
# Un article reçoit le thème qui a le plus de mots-clés présents dans son titre et son extrait ;
# en cas d'égalité, le premier thème du fichier. Sans aucun mot-clé : « Autres » (CdC §4.2).
# Mots entiers, sans tenir compte des majuscules ni des accents.
# « Modèles », « Agents » et « Recherche & évaluation » découpent l'ancien thème
# « Modèles & recherche » (D20, mesuré sur trois jours de vrais flux, #26).
